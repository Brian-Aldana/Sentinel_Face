services:
  db:
    image: mariadb:10.11
    container_name: sentinel_face_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-sentinel_root_pass}
      MYSQL_DATABASE: ${DB_NAME:-sentinel_face}
      MYSQL_USER: ${DB_USER:-sentinel}
      MYSQL_PASSWORD: ${DB_PASSWORD:-sentinel_pass}
    ports:
      - "${HOST_DB_PORT:-3307}:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./SENTINEL_FACE_BACKEND/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sentinel_net

  backend:
    build:
      context: ./SENTINEL_FACE_BACKEND
      dockerfile: Dockerfile
    container_name: sentinel_face_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD:-sentinel_root_pass}
      DB_NAME: ${DB_NAME:-sentinel_face}
      DB_POOL_SIZE: 10
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-sentinel_super_secret_jwt_key_2026_xyz123456789}
      JWT_ACCESS_TOKEN_EXPIRES: ${JWT_ACCESS_TOKEN_EXPIRES:-3600}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      RATELIMIT_STORAGE_URL: memory://
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL:-admin@admin.com}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD:-AdminSentinel2026!}
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    networks:
      - sentinel_net

volumes:
  db_data:
    driver: local

networks:
  sentinel_net:
    driver: bridge
